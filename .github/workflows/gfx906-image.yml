name: gfx906 image

on:
  push:
    tags: ["gfx906-v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number and commit in --version come from the history.
          fetch-depth: 0
      # The ROCm image is large, and the build needs it twice: as build stage and as base of the result.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - id: args
        # gfx906-v0.6.0 -> b12230-v0.6.0
        run: |
          echo "tag=$(sed -n 's/^ARG UPSTREAM_REF=//p' .devops/gfx906.Dockerfile)-${GITHUB_REF_NAME#gfx906-}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .devops/gfx906.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.args.outputs.tag }}
