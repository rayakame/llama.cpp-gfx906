name: gfx906 check

on:
  workflow_dispatch:
  push:
    branches: [gfx906]
    paths:
      - '.github/workflows/gfx906-check.yml'
      - '**/*.cu'
      - '**/*.cuh'
      - 'ggml/src/ggml-cuda/CMakeLists.txt'
      - 'ggml/src/ggml-hip/CMakeLists.txt'
      - 'scripts/hip/gfx906-*'

permissions:
  contents: read

jobs:
  spills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # The kernels compiled as the image compiles them, with the compiler's resource remarks.
      - name: Build ggml-hip with metrics
        run: |
          docker run --rm -v "$PWD:/src" -w /src docker.io/mixa3607/rocm-gfx906:10.1-complete-20261018172427 bash -c '
            set -eo pipefail
            (apt-get update || true) && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 >/dev/null
            export HIPCXX="$(hipconfig -l)/clang" HIP_PATH="$(hipconfig -R)"
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DGGML_NATIVE=OFF \
              -DGGML_HIP=ON -DAMDGPU_TARGETS=gfx906 -DGGML_HIP_EXPORT_METRICS=ON \
              "-DCMAKE_HIP_FLAGS=-mllvm -amdgpu-sched-strategy=max-ilp" >/dev/null
            cmake --build build --target ggml-hip -j"$(nproc)" > build/metrics.log 2>&1 || { tail -50 build/metrics.log; exit 1; }'
      - name: Spills against the baseline
        run: python3 scripts/hip/gfx906-spill-check.py build/metrics.log scripts/hip/gfx906-spills.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gfx906-metrics
          path: build/metrics.log
